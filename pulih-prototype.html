<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulih Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a working app shell. Top bar with mode switch, tabs grouped as Core platform then School mode, two-column work area. */
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --ink: #15252c;
  --muted: #5a6b72;
  --line: #d6dfdd;
  --primary: #0d5a66;
  --primary-soft: #dcecee;
  --accent: #d9961a;
  --accent-soft: #fbefd6;
  --good: #2c8a57;
  --good-soft: #def1e5;
  --warn: #b8730e;
  --crit: #bf3b2a;
  --crit-soft: #f8e1dd;
  --display: "Sora", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1719; --surface: #172327; --ink: #e4ecec; --muted: #9db0b4; --line: #2a3a3e;
    --primary: #5fb6c2; --primary-soft: #1c3a40; --accent: #f0b445; --accent-soft: #3a2f17;
    --good: #5cc98b; --good-soft: #17352a; --warn: #e8a03a; --crit: #ef7a66; --crit-soft: #3e1f1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1719; --surface: #172327; --ink: #e4ecec; --muted: #9db0b4; --line: #2a3a3e;
  --primary: #5fb6c2; --primary-soft: #1c3a40; --accent: #f0b445; --accent-soft: #3a2f17;
  --good: #5cc98b; --good-soft: #17352a; --warn: #e8a03a; --crit: #ef7a66; --crit-soft: #3e1f1a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h2 { font-size: 18px; }
h3 { font-size: 15px; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }

header.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.bar { max-width: 1180px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font-size: 22px; color: var(--primary); letter-spacing: -0.02em; }
.brand span { font-size: 13px; color: var(--muted); }
.mode { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 3px; }
.mode button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); }
.mode button[aria-pressed="true"].peace { background: var(--good-soft); color: var(--good); }
.mode button[aria-pressed="true"].disaster { background: var(--crit-soft); color: var(--crit); }
nav.tabs { max-width: 1180px; margin: 0 auto; padding: 0 16px; display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-end; }
.tabgroup { display: flex; flex-direction: column; gap: 2px; }
.tabgroup .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.tabgroup .row { display: flex; gap: 4px; }
.tab { border: 0; background: none; padding: 8px 10px 10px; border-bottom: 3px solid transparent; font-weight: 600; color: var(--muted); }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--primary); }
.tabgroup.school .tab[aria-current="page"] { border-bottom-color: var(--accent); }

.banner { max-width: 1180px; margin: 14px auto 0; padding: 0 16px; }
.banner div { border-radius: 10px; padding: 10px 14px; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner .disaster { background: var(--crit-soft); color: var(--crit); }
.banner .peace { background: var(--good-soft); color: var(--good); }
.banner strong { font-weight: 600; }

main { max-width: 1180px; margin: 0 auto; padding: 16px 16px 48px; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.grid.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 860px) { .grid, .grid.even { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--surface); }

.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.open { background: var(--good-soft); color: var(--good); }
.pill.verified { background: var(--primary-soft); color: var(--primary); }
.pill.child { background: var(--accent-soft); color: var(--warn); }
.pill.priority { background: var(--accent); color: #2a1d02; }
.pill.full { background: var(--line); color: var(--muted); }
.pill.risk-high { background: var(--crit-soft); color: var(--crit); }
.pill.type { background: transparent; border: 1px solid var(--line); color: var(--muted); font-weight: 500; }

.task { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; border-left: 4px solid var(--line); }
.task.prio { border-left-color: var(--accent); }
.task.isfull { opacity: 0.7; }
.task .title { font-weight: 600; }
.task .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.task .actions { grid-row: span 2; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.meter { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; min-width: 120px; }
.meter i { display: block; height: 100%; background: var(--primary); border-radius: 999px; }
.meter.good i { background: var(--good); }
.redirect { grid-column: 1 / -1; font-size: 13px; background: var(--accent-soft); color: var(--ink); padding: 6px 10px; border-radius: 8px; }
.redirect button { border: 0; background: none; color: var(--primary); font-weight: 600; text-decoration: underline; padding: 0; }

.btn { border: 1px solid var(--primary); background: var(--primary); color: var(--surface); border-radius: 8px; padding: 7px 14px; font-weight: 600; font-size: 14px; }
.btn.ghost { background: transparent; color: var(--primary); }
.btn.warn { background: var(--crit); border-color: var(--crit); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #2a1d02; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.sm { padding: 4px 10px; font-size: 13px; }

.profile { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-family: var(--display); font-weight: 700; }
.tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tiers div { border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 12px; }
.tiers div.on { border-color: var(--primary); background: var(--primary-soft); }
.tiers b { display: block; font-size: 13px; }

.mytask { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.mytask .row { display: flex; gap: 6px; flex-wrap: wrap; }
.status { font-size: 12px; font-weight: 600; }
.status.accepted { color: var(--primary); }
.status.onsite { color: var(--good); }
.status.done { color: var(--muted); }
.status.overdue { color: var(--crit); }

form.f { display: grid; gap: 10px; }
form.f label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
form.f input, form.f select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-weight: 400; font-size: 14px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 700px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.kpi b { display: block; font-family: var(--display); font-size: 26px; font-variant-numeric: tabular-nums; }
.kpi.alert b { color: var(--crit); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }

.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 600px) { .compare { grid-template-columns: 1fr; } }
.barrow { display: grid; grid-template-columns: 150px 1fr 34px; gap: 8px; align-items: center; font-size: 13px; }
.barrow .track { height: 14px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.barrow .track i { display: block; height: 100%; background: var(--primary); }
.barrow .track i.hot { background: var(--crit); }
.barrow .track i.fair { background: var(--good); }

.rooms { display: grid; gap: 8px; }
.room { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; }
.room .name { font-weight: 600; }
.room select { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; background: var(--surface); }
.photo { position: relative; overflow: hidden; }
.photo input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.sev-Severe { color: var(--crit); font-weight: 600; }
.sev-Moderate { color: var(--warn); font-weight: 600; }
.ai { font-size: 12px; color: var(--muted); grid-column: 1 / -1; }

.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.steps li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.steps li.done .dot { background: var(--good); border-color: var(--good); color: var(--surface); }
.steps li.done { background: var(--good-soft); border-color: transparent; }
.rules { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.rules ul { margin: 6px 0 0; padding-left: 18px; }
.report { background: var(--bg); border-radius: 8px; padding: 10px 12px; font-size: 13px; white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; max-height: 220px; overflow: auto; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: min(520px, calc(100% - 32px)); z-index: 20; box-shadow: 0 6px 24px rgba(0,0,0,0.2); }
.toast[hidden] { display: none; }
.demo-note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 24px; }
@media (prefers-reduced-motion: no-preference) { .meter i, .barrow .track i { transition: width 0.4s ease; } }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand"><h1>Pulih</h1><span>Verified needs. Safe help. Fair recovery.</span></div>
    <div class="mode" role="group" aria-label="Platform mode">
      <button id="mode-peace" class="peace" type="button">Peacetime</button>
      <button id="mode-disaster" class="disaster" type="button">Disaster mode</button>
    </div>
  </div>
  <nav class="tabs" aria-label="Views">
    <div class="tabgroup">
      <span class="label">Core platform</span>
      <div class="row">
        <button class="tab" data-view="tasks" type="button">Find tasks</button>
        <button class="tab" data-view="post" type="button">Post needs</button>
        <button class="tab" data-view="dashboard" type="button">Coordinator</button>
      </div>
    </div>
    <div class="tabgroup school">
      <span class="label">School mode</span>
      <div class="row">
        <button class="tab" data-view="school" type="button">School recovery</button>
      </div>
    </div>
  </nav>
</header>
<div class="banner" id="banner"></div>
<main id="app"></main>
<p class="demo-note">Prototype with example data. Verification, AI damage tagging and notifications are simulated.</p>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
const TIERS = ['Open', 'Verified ID', 'Child-safe'];
const TIER_CLASS = ['open', 'verified', 'child'];
const SITE_TYPES = { school: 'School', home: 'Home', shelter: 'Relief center', clinic: 'Clinic' };
const KIND_LABEL = { people: 'Volunteers', asset: 'Asset', supply: 'Supplies' };

const state = {
  mode: 'disaster',
  view: 'tasks',
  filter: 'all',
  me: { name: 'Aina Rahman', tier: 0, score: 12, done: 3, assets: ['Car, 5 seats'], childPending: false },
  myTasks: [],
  alerts: [],
  sim: null,
  schoolId: 's2',
  school: {},
  sites: [
    { id: 's1', name: 'SK Taman Seri Bayu', type: 'school', area: 'Shah Alam (urban)', overlooked: false, verifiedBy: 'School code', mine: true },
    { id: 's2', name: 'SK Kampung Batu Lima', type: 'school', area: 'Hulu Langat (rural)', overlooked: true, verifiedBy: 'School code', mine: true },
    { id: 's3', name: 'Dewan Seri Muda relief center', type: 'shelter', area: 'Shah Alam', overlooked: false, verifiedBy: 'District office', mine: false },
    { id: 's4', name: 'Mak Cik Aminah, 74, lives alone', type: 'home', area: 'Kampung Jawa', overlooked: true, verifiedBy: 'Village head', mine: false },
    { id: 's5', name: 'Klinik Desa Sungai Lui', type: 'clinic', area: 'Hulu Langat (rural)', overlooked: true, verifiedBy: 'Health office', mine: false }
  ],
  needs: [
    { id: 'n1', site: 's1', title: 'Mud cleanup, Block A classrooms', kind: 'people', qty: 20, filled: 20, tier: 0, risk: 'low', when: 'Sat 8am to 11am', phase: 'disaster' },
    { id: 'n2', site: 's1', title: 'Pressure washer with operator', kind: 'asset', qty: 3, filled: 3, tier: 1, risk: 'low', when: 'Sat 8am', phase: 'disaster' },
    { id: 'n3', site: 's2', title: 'Mud cleanup, classrooms and library', kind: 'people', qty: 25, filled: 4, tier: 0, risk: 'low', when: 'Sat 8am to 12pm', phase: 'disaster' },
    { id: 'n4', site: 's2', title: 'Lorry to remove damaged furniture', kind: 'asset', qty: 1, filled: 0, tier: 1, risk: 'medium', when: 'Sun 9am', phase: 'disaster' },
    { id: 'n5', site: 's2', title: 'Year 6 textbook sets', kind: 'supply', qty: 120, filled: 10, tier: 0, risk: 'low', when: 'This week', phase: 'disaster' },
    { id: 'n6', site: 's3', title: 'Kitchen helpers, evening meal', kind: 'people', qty: 8, filled: 6, tier: 0, risk: 'low', when: 'Today 4pm', phase: 'disaster' },
    { id: 'n7', site: 's4', title: 'Move furniture out and wash floors', kind: 'people', qty: 2, filled: 0, tier: 1, risk: 'medium', when: 'Sun 10am, 2 hours', phase: 'disaster' },
    { id: 'n8', site: 's5', title: 'Clinic floor disinfection', kind: 'people', qty: 6, filled: 1, tier: 1, risk: 'medium', when: 'Sun 8am', phase: 'disaster' },
    { id: 'n9', site: 's2', title: 'Reading corner for pupils at temporary class', kind: 'people', qty: 4, filled: 0, tier: 2, risk: 'low', when: 'Weekdays 9am', phase: 'disaster' },
    { id: 'n10', site: 's3', title: 'Boat with operator to check stranded residents', kind: 'asset', qty: 2, filled: 1, tier: 1, risk: 'high', when: 'Now', phase: 'disaster' },
    { id: 'p1', site: 's4', title: 'Clear drains around the house before monsoon', kind: 'people', qty: 2, filled: 0, tier: 1, risk: 'low', when: 'Sat, 1 hour', phase: 'peace' },
    { id: 'p2', site: 's2', title: 'Move library books to the upper floor', kind: 'people', qty: 6, filled: 2, tier: 0, risk: 'low', when: 'Fri 3pm, 1 hour', phase: 'peace' },
    { id: 'p3', site: 's3', title: 'Pack go-bags for elderly residents', kind: 'people', qty: 5, filled: 1, tier: 0, risk: 'low', when: 'Sun 10am, 1 hour', phase: 'peace' },
    { id: 'p4', site: 's1', title: 'School gotong-royong, compound cleanup', kind: 'people', qty: 30, filled: 30, tier: 0, risk: 'low', when: 'Sat 7:30am', phase: 'peace' },
    { id: 'p5', site: 's5', title: 'Back up patient records to the cloud', kind: 'people', qty: 1, filled: 0, tier: 1, risk: 'low', when: 'Any weekday, 1 hour', phase: 'peace' }
  ]
};

const ROOMS = [
  { key: 'blockA', name: 'Block A classrooms (ground floor)', ai: 'Severe' },
  { key: 'blockB', name: 'Block B classrooms (first floor)', ai: 'Light' },
  { key: 'library', name: 'Library', ai: 'Severe' },
  { key: 'science', name: 'Science lab', ai: 'Moderate' },
  { key: 'computer', name: 'Computer lab', ai: 'Severe' },
  { key: 'toilets', name: 'Toilets', ai: 'Moderate' },
  { key: 'canteen', name: 'Canteen', ai: 'Severe' },
  { key: 'field', name: 'School field', ai: 'Moderate' }
];
const SEVERITIES = ['Not checked', 'None', 'Light', 'Moderate', 'Severe'];

function schoolState(id) {
  if (!state.school[id]) {
    state.school[id] = { sev: {}, photos: {}, aiTagged: {}, generated: false, evacuees: false, inspection: false, reopened: false };
  }
  return state.school[id];
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const site = id => state.sites.find(s => s.id === id);
const need = id => state.needs.find(n => n.id === id);
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;

function priority(n) {
  const s = site(n.site);
  const unmet = (n.qty - n.filled) / n.qty;
  return unmet * (s.overlooked ? 1.6 : 1) * (n.risk === 'high' ? 1.2 : 1);
}

function liveNeeds() {
  return state.needs.filter(n => n.phase === state.mode);
}

function alternativesFor(n) {
  return liveNeeds()
    .filter(x => x.id !== n.id && x.filled < x.qty && x.kind === n.kind && x.tier <= state.me.tier)
    .sort((a, b) => priority(b) - priority(a))
    .slice(0, 1);
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 3600);
}

function tierPill(t) { return `<span class="pill ${TIER_CLASS[t]}">${TIERS[t]}</span>`; }

/* ---------- Core: find tasks (volunteer) ---------- */
function viewTasks() {
  const types = ['all', 'school', 'home', 'shelter', 'clinic'];
  let list = liveNeeds();
  if (state.filter !== 'all') list = list.filter(n => site(n.site).type === state.filter);
  const open = list.filter(n => n.filled < n.qty).sort((a, b) => priority(b) - priority(a));
  const full = list.filter(n => n.filled >= n.qty);
  const cards = [...open, ...full].map(taskCard).join('') || '<p class="muted">No tasks match this filter.</p>';
  return `
  <div class="grid">
    <section class="panel" aria-labelledby="feed-h">
      <div class="head">
        <h2 id="feed-h">${state.mode === 'disaster' ? 'Needs near you, most urgent first' : 'Small acts this week'}</h2>
        <span class="small muted">Sorted by unmet need, not by popularity</span>
      </div>
      <div class="chips" role="group" aria-label="Filter by place">
        ${types.map(t => `<button class="chip" type="button" data-filter="${t}" aria-pressed="${state.filter === t}">${t === 'all' ? 'All places' : SITE_TYPES[t]}</button>`).join('')}
      </div>
      ${cards}
    </section>
    <aside class="stack">${profilePanel()}${myTasksPanel()}</aside>
  </div>`;
}

function taskCard(n) {
  const s = site(n.site);
  const isFull = n.filled >= n.qty;
  const mine = state.myTasks.some(t => t.need === n.id && t.status !== 'done');
  const locked = n.tier > state.me.tier;
  const prio = !isFull && s.overlooked;
  let action;
  if (mine) action = '<span class="pill verified">You\'re on this</span>';
  else if (isFull) action = '<span class="pill full">Full</span>';
  else if (locked) action = `<button class="btn ghost sm" type="button" data-unlock="${n.tier}">Unlock: ${TIERS[n.tier]}</button>`;
  else action = `<button class="btn sm" type="button" data-accept="${n.id}">${n.kind === 'supply' ? 'Pledge' : 'I\'ll help'}</button>`;
  let redirect = '';
  if (isFull) {
    const alt = alternativesFor(n)[0];
    if (alt) redirect = `<div class="redirect">This one is full. <strong>${esc(site(alt.site).name)}</strong> still needs ${alt.qty - alt.filled} more for "${esc(alt.title)}". <button type="button" data-accept="${alt.id}">Help there instead</button></div>`;
  }
  return `
  <article class="task ${prio ? 'prio' : ''} ${isFull ? 'isfull' : ''}">
    <div>
      <div class="title">${esc(n.title)}</div>
      <div class="meta">

function simResult() {
  const max = 40;
  const bar = (label, v, cls) => `<div class="barrow"><span>${esc(label)}</span><span class="track"><i class="${cls}" style="width:${pct(v, max)}%"></i></span><span class="num">${v}</span></div>`;
  const names = state.sim.order;
  return `
  <div class="compare">
    <div><h3>Without Pulih</h3>${names.map(id => bar(site(id).name, id === 's1' ? 40 : 0, 'hot')).join('')}<p class="small muted">All 40 go to the viral school, which is already full.</p></div>
    <div><h3>With Pulih</h3>${names.map(id => bar(site(id).name, state.sim.alloc[id] || 0, 'fair')).join('')}<p class="small muted">The full site is capped. Volunteers go to open, overlooked needs first.</p></div>
  </div>`;
}

function runSim() {
  let remaining = 40;
  const alloc = {};
  const open = state.needs.filter(n => n.phase === 'disaster' && n.kind === 'people' && n.tier === 0 && n.filled < n.qty)
    .sort((a, b) => priority(b) - priority(a));
  for (const n of open) {
    if (!remaining) break;
    const take = Math.min(remaining, n.qty - n.filled);
    n.filled += take; remaining -= take;
    alloc[n.site] = (alloc[n.site] || 0) + take;
  }
  const order = ['s1', 's2', 's3', 's4', 's5'];
  state.sim = { alloc, order };
  toast(`Pulih capped the full site and redirected ${40 - remaining} volunteers to open needs${remaining ? `; ${remaining} put on standby` : ''}.`);
}

function generatedFor(roomKey, sev) {
  const big = sev === 'Severe';
  const map = {
    blockA: [['Mud cleanup, Block A classrooms', 'people', big ? 15 : 8, 0, 'low'], big && ['Desk and chair sets, Block A', 'supply', 40, 0, 'low']],
    blockB: [['Cleanup, Block B classrooms', 'people', big ? 12 : 6, 0, 'low'], big && ['Desk and chair sets, Block B', 'supply', 30, 0, 'low']],
    library: [['Library cleanup and book sorting', 'people', big ? 6 : 4, 0, 'low'], big && ['Replacement library books', 'supply', 300, 0, 'low']],
    science: [['Electrician to check lab wiring', 'people', 1, 1, 'high'], ['Science lab cleanup', 'people', 4, 0, 'medium']],
    computer: [['Electrician to check computer lab wiring', 'people', 1, 1, 'high'], big && ['Laptops or desktops for computer lab', 'supply', 20, 0, 'low']],
    toilets: [['Toilet sanitation crew', 'people', 6, 0, 'medium']],
    canteen: [['Canteen cleanup', 'people', 4, 0, 'low'], big && ['Canteen fridge and stove', 'supply', 2, 0, 'low']],
    field: [['Lorry for debris removal from field', 'asset', 1, 1, 'medium']]
  };
  return (map[roomKey] || []).filter(Boolean);
}

function generateNeeds() {
  const s = site(state.schoolId), st = schoolState(s.id);
  const prefix = 'g-' + s.id + '-';
  const keep = {};
  state.needs.filter(n => n.id.startsWith(prefix)).forEach(n => { keep[n.title] = n.filled; });
  state.needs = state.needs.filter(n => !n.id.startsWith(prefix));
  let count = 0;
  ROOMS.forEach(r => {
    const sev = st.sev[r.key];
    if (sev !== 'Moderate' && sev !== 'Severe') return;
    generatedFor(r.key, sev).forEach(([title, kind, qty, tier, risk], i) => {
      state.needs.push({ id: prefix + r.key + i, site: s.id, title, kind, qty, filled: Math.min(keep[title] || 0, qty), tier, risk, when: kind === 'supply' ? 'This week' : 'Sat 8am to 12pm', phase: 'disaster' });
      count++;
    });
  });
  st.generated = true;
  toast(count ? `${count} needs posted for ${s.name}. Volunteers can see them now.` : 'No moderate or severe damage marked, so no needs were posted.');
}

function reportText(s, st) {
  const lines = ROOMS.map(r => `${r.name}: ${st.sev[r.key] || 'Not checked'} (${st.photos[r.key] || 0} photos)`);
  const ns = state.needs.filter(n => n.site === s.id && n.id.startsWith('g-'));
  return `FLOOD DAMAGE REPORT\nSchool: ${s.name}, ${s.area}\nVerified by: ${s.verifiedBy}\n\nAreas\n- ${lines.join('\n- ')}\n\nNeeds posted\n- ${ns.map(n => `${n.title}: ${n.qty}`).join('\n- ') || 'None'}`;
}

/* ---------- Render and events ---------- */
function render() {
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.view === state.view ? 'page' : 'false'));
  document.getElementById('mode-peace').setAttribute('aria-pressed', state.mode === 'peace');
  document.getElementById('mode-disaster').setAttribute('aria-pressed', state.mode === 'disaster');
  document.getElementById('banner').innerHTML = state.mode === 'disaster'
    ? '<div class="disaster"><strong>Flood alert, Selangor. Disaster mode is on.</strong><span>9 registered vulnerable residents are being checked first.</span></div>'
    : '<div class="peace"><strong>Peacetime mode.</strong><span>Small one-hour acts keep volunteers active, verified and ready.</span></div>';
  const app = document.getElementById('app');
  app.innerHTML = { tasks: viewTasks, post: viewPost, dashboard: viewDashboard, school: viewSchool }[state.view]();
}

function go(view) {
  state.view = view;
  if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view);
  render();
  window.scrollTo(0, 0);
}

function accept(id) {
  const n = need(id);
  if (n.tier > state.me.tier) { toast(`This task needs ${TIERS[n.tier]}. Unlock it from your profile.`); return; }
  if (n.filled >= n.qty) { toast('That task just filled up. Try the suggested one instead.'); return; }
  n.filled++;
  if (n.kind === 'supply') { toast(`Pledge recorded for ${site(n.site).name}. Drop-off details sent.`); render(); return; }
  state.myTasks.push({ id: 't' + Date.now(), need: id, status: 'accepted' });
  toast(`You're on "${n.title}". Check in when you arrive.`);
  render();
}

function unlock(tier) {
  if (tier === 1) { state.me.tier = Math.max(state.me.tier, 1); state.me.score += 5; toast('ID verified (simulated). Homes, assets and clinic tasks are unlocked.'); }
  else if (tier === 2) {
    if (state.me.tier < 1) { toast('Verify your ID first, then request child-safe clearance.'); return; }
    state.me.childPending = true; toast('Child-safe clearance requested. The background check usually takes 3 to 5 days.');
  }
  render();
}

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  if (d.view) go(d.view);
  else if (b.id === 'mode-peace' || b.id === 'mode-disaster') { state.mode = b.id === 'mode-peace' ? 'peace' : 'disaster'; toast(state.mode === 'disaster' ? 'Disaster mode on. Vulnerable residents are checked first.' : 'Back to peacetime mode.'); render(); }
  else if (d.filter) { state.filter = d.filter; render(); }
  else if (d.accept) accept(d.accept);
  else if (d.unlock) unlock(Number(d.unlock));
  else if ('approveChild' in d) { state.me.tier = 2; state.me.childPending = false; state.me.score += 10; toast('Child-safe clearance approved (demo).'); render(); }
  else if (d.checkin) { const t = state.myTasks.find(x => x.id === d.checkin); const due = new Date(Date.now() + 3 * 3600e3); t.status = 'onsite'; t.due = due.toTimeString().slice(0, 5); toast('Checked in. Stay with your group and check out when you leave.'); render(); }
  else if (d.checkout) { const t = state.myTasks.find(x => x.id === d.checkout); t.status = 'done'; state.me.done++; state.me.score += 10; state.alerts = state.alerts.filter(a => !a.includes(need(t.need).title)); toast('Checked out safely. Trust score +10.'); render(); }
  else if (d.overdue) { const t = state.myTasks.find(x => x.id === d.overdue); t.status = 'overdue'; state.alerts.push(`${state.me.name} is overdue at "${need(t.need).title}". Last check-in on site.`); toast('Overdue: the site coordinator and your emergency contact are alerted.'); render(); }
  else if (d.sos) { const t = state.myTasks.find(x => x.id === d.sos); state.alerts.push(`${state.me.name} asked for help at "${need(t.need).title}".`); toast('Help request sent to the site coordinator.'); render(); }
  else if (d.resolve) { state.alerts.splice(Number(d.resolve), 1); render(); }
  else if (b.id === 'simViral') { runSim(); render(); }
  else if (b.id === 'genNeeds') { generateNeeds(); render(); }
  else if (b.id === 'autoWalk') { const st = schoolState(state.schoolId); ROOMS.forEach(r => { st.photos[r.key] = (st.photos[r.key] || 0) + 2; st.sev[r.key] = r.ai; st.aiTagged[r.key] = true; }); toast('Walkthrough filled with example photos and AI tags.'); render(); }
  else if (b.id === 'fillSchool') { state.needs.filter(n => n.site === state.schoolId && n.phase === 'disaster').forEach(n => { n.filled = n.qty; }); toast('All tasks for this school are filled (demo).'); render(); }
  else if (d.stage) { const st = schoolState(state.schoolId); st[d.stage] = !st[d.stage]; render(); }
  else if (b.id === 'reopen') { schoolState(state.schoolId).reopened = true; toast(`${site(state.schoolId).name} is reopened. 412 parents notified (simulated).`); render(); }
  else if (b.id === 'copyReport') {
    const txt = document.getElementById('report').textContent;
    try { navigator.clipboard.writeText(txt).then(() => toast('Report copied.'), () => toast('Copy was blocked. Select the report text and copy it.')); }
    catch (err) { toast('Copy was blocked. Select the report text and copy it.'); }
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'pickSchool') { state.schoolId = el.value; render(); }
  else if (el.dataset.sev) { schoolState(state.schoolId).sev[el.dataset.sev] = el.value; render(); }
  else if (el.dataset.photo) {
    const st = schoolState(state.schoolId), key = el.dataset.photo;
    st.photos[key] = (st.photos[key] || 0) + (el.files ? el.files.length : 1);
    if (!st.sev[key] || st.sev[key] === 'Not checked') { st.sev[key] = ROOMS.find(r => r.key === key).ai; st.aiTagged[key] = true; }
    render();
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'needForm') {
    const v = id => document.getElementById(id).value;
    const title = v('nf-title').trim();
    if (!title) return;
    state.needs.push({ id: 'u' + Date.now(), site: v('nf-site'), title, kind: v('nf-kind'), qty: Math.max(1, Number(v('nf-qty')) || 1), filled: 0, tier: Number(v('nf-tier')), risk: v('nf-risk'), when: v('nf-when') || 'Flexible', phase: state.mode });
    toast('Need posted. It is now ranked in every volunteer\'s feed.');
    render();
  } else if (e.target.id === 'siteForm') {
    const v = id => document.getElementById(id).value;
    const name = v('sf-name').trim(), area = v('sf-area').trim();
    if (!name || !area) return;
    const type = v('sf-type');
    state.sites.push({ id: 'x' + Date.now(), name, type, area, overlooked: v('sf-rural') === 'yes', verifiedBy: type === 'school' ? 'School code' : type === 'home' ? 'Village head' : 'District office', mine: true });
    toast(`${name} registered and verified (simulated).`);
    render();
  }
});

function fromHash() {
  const h = location.hash.slice(1);
  if (['tasks', 'post', 'dashboard', 'school'].includes(h)) state.view = h;
  render();
}
window.addEventListener('hashchange', fromHash);
window.addEventListener('popstate', fromHash);
fromHash();
</script>
</body>
</html>
