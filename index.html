<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ReadyHands prototype: the right volunteer, with the right skills and equipment, sent safely to where help is needed. Sample data only.">
  <meta name="theme-color" content="#225B45">
  <title>ReadyHands</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23225B45'/%3E%3Cpath d='M10 24v-6l-3-3v-4a1.5 1.5 0 0 1 3 0v3l3 2v8M22 24v-6l3-3v-4a1.5 1.5 0 0 0-3 0v3l-3 2v8' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <dialog id="dialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p style="padding:24px;font:18px system-ui">ReadyHands needs JavaScript to run this prototype.</p></noscript>
  <script>
    // Opened by double-click (file://)? Browsers block module scripts there, so explain how to run it.
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML =
        '<div style="max-width:640px;margin:48px auto;padding:24px;font:18px/1.55 system-ui,sans-serif;color:#183E35;background:#fff;border:1px solid #DCE4D9;border-radius:14px">' +
        '<h1 style="margin-top:0">ReadyHands needs to be started first</h1>' +
        '<p>This page was opened as a file, so the browser blocked the app from loading.</p>' +
        '<ol><li>Open a terminal in this folder.</li><li>Run <code>npm start</code> (needs Node.js 20 or newer).</li>' +
        '<li>Open <a href="http://localhost:5173">http://localhost:5173</a>.</li></ol>' +
        '<p>See README.md for more help.</p></div>';
    }
  </script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
